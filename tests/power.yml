---
- name: Test power policy only on disposable GitHub-hosted runners
  hosts: all
  gather_facts: true
  vars:
    workbench_manage_services: true
    workbench_always_on: true
  pre_tasks:
    - name: Refuse accidental execution outside GitHub Actions
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'GITHUB_ACTIONS') == 'true'
          - ansible_facts.service_mgr == 'systemd'
  roles:
    - role: ../roles/always_on
