---
# Per-host profile and existing user are REQUIRED; never inherit controller HOME/USER.
workbench_allow_local_macos: false
workbench_manage_services: true
workbench_manage_docker: true
# Joining docker grants root-equivalent access. Opt in only for trusted users.
workbench_docker_group: false
workbench_extra_packages: []
workbench_macos_start_colima: false
# Linux only. false removes our two drop-ins, leaving all other policy intact.
workbench_always_on: true
