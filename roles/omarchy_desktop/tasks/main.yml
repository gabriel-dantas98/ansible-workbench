---
- name: Check pending upgrades without refreshing the Omarchy package database
  ansible.builtin.command: pacman -Qu
  register: omarchy_desktop_pending
  changed_when: false
  failed_when: omarchy_desktop_pending.rc not in [0, 1]
  check_mode: false

- name: Require supported Omarchy maintenance before adding packages
  ansible.builtin.assert:
    that: omarchy_desktop_pending.stdout | trim | length == 0
    fail_msg: >-
      Pending upgrades exist in the local package catalog. Run omarchy update from
      a suitable maintenance console, complete migrations, then retry. This role
      never refreshes mirrors, runs direct system upgrades or bypasses Omarchy guards.

- name: Install only missing development utilities from the existing Omarchy catalog
  community.general.pacman:
    name: '{{ workbench_packages + workbench_extra_packages }}'
    state: present
    update_cache: false
  register: omarchy_desktop_packages
  become: true

- name: Enable Tailscale without restarting the authenticated transport
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started
  become: true
  when:
    - workbench_manage_services | bool
    - not ansible_check_mode or not omarchy_desktop_packages.changed

- name: Enable the existing Omarchy Docker service when requested
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  become: true
  when:
    - workbench_manage_services | bool
    - workbench_manage_docker | bool
